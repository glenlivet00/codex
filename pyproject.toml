[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketdata-cli"
version = "0.1.0"
description = "Market data CLI powered by yfinance"
requires-python = ">=3.10"
dependencies = ["yfinance>=0.2.65,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
marketdata = "marketdata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
